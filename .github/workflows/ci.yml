name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: fmt, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Build (release)
        run: cargo build --workspace --release

      # Build requirements note: eframe/wgpu load Vulkan and the Wayland/X11
      # client libraries at runtime (dlopen), so no extra apt packages are
      # needed to build or test here.
      - name: Test
        run: cargo test --workspace

  windows:
    name: windows (check, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # MSVC, CMake and NASM come with the windows-latest image; the TLS
      # crates (`ring`, `aws-lc-sys`) need all three.
      - name: Check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release -p stormscope-app

      - name: Upload the Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: stormscope-windows-x86_64
          path: target/release/stormscope.exe
          if-no-files-found: error

  # Android builds are still maturing; keep the job informational so a
  # transient runner/NDK issue does not block unrelated pushes. It builds the
  # Rust cdylib (the part that can fail on code changes) and uploads it.
  android:
    name: android (rust cdylib)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install the Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build the Android cdylib
        run: cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build --release -p stormscope-android

      - name: Upload the Android library
        uses: actions/upload-artifact@v4
        with:
          name: stormscope-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/libstormscope_android.so
          if-no-files-found: error

  clippy:
    name: clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      # Informational on purpose: ~100 pre-existing style lints (the first
      # one clippy stops on is clippy::chunks_exact_to_as_chunks in
      # radar-decode). Without `-D warnings` the lints surface as annotated
      # warnings on the run while the job itself stays green; once the
      # backlog is cleaned up, add `-- -D warnings` here to make it gating.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
