[package]
name = "stormscope-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Windows single-file release: embed the Piper runtime and lessac voice in the
# executable. CI prepares assets/piper-windows.zip before enabling this; a
# normal developer build leaves it off and uses a sidecar/SAPI fallback.
embedded-piper = []

[[bin]]
name = "stormscope"
path = "src/main.rs"

[dependencies]
radar-core = { workspace = true }
radar-decode = { workspace = true }
radar-data = { workspace = true }
radar-render = { workspace = true }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
bytemuck.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
# The AI snapshot reports the user's local timezone name so the model can
# quote arrival times in the reader's clock, not UTC.
iana-time-zone = "0.1"
serde.workspace = true
serde_json.workspace = true
earcutr.workspace = true
# Force the wgpu renderer (Vulkan on Linux) and native Wayland windows.
# eframe's `default` includes both glow and wgpu; glow is dropped so the app is
# Vulkan-only, with wayland+x11 for native Wayland (X11 as fallback).
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.36"
egui_extras.workspace = true
jiff.workspace = true
# Same wgpu line eframe uses, so there is a single GPU/Vulkan context and
# egui_wgpu::RenderState can name the device handed to the renderer.
egui-wgpu = "0.36"
wgpu = { workspace = true }
# Decode the embedded window icon (512x512 PNG) at startup.
image = { version = "0.25", default-features = false, features = ["png"] }

# Allocator tuning (see main.rs) is glibc-only: return freed decode buffers to
# the OS so a stormscope left open for a day doesn't grow into a memory-pressure
# problem. Windows and macOS use their own allocators.
[target.'cfg(target_env = "gnu")'.dependencies]
libc = "0.2"

# Embeds the .ico into stormscope.exe (Explorer/taskbar icon) on Windows.
[build-dependencies]
# Also used when cross-compiling the Windows release from Linux; the build
# script gates on CARGO_CFG_TARGET_OS, not the host.
winresource = "0.1"

# In-app YouTube playback uses a platform WebView parented to the main
# window. Linux is X11/XWayland only for this child view; the app selects the
# X11 backend before eframe starts (see main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
raw-window-handle = "0.6"
wry = { version = "0.57", default-features = false, features = ["os-webview", "x11"] }

# Force the native window frame dark (the app itself is always dark).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[dev-dependencies]
# Headless render smoke test (`tests/render3d_smoke.rs`, ignored by default):
# block_on for the async adapter/device request, png to dump the frame for
# eyeballing.
pollster = "0.4"
png = "0.17"

# Android: the IME bridge polls GameActivity's editor state (Gboard commits
# land there even though winit never forwards IME text to egui).
[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
jni = "0.22"
# Gemini Live: one WebSocket carries the conversation while the Java audio
# helper streams 16 kHz PCM up and 24 kHz PCM down.
base64 = "0.23"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
# The app's reqwest stack enables both aws-lc-rs and ring in the same rustls
# build, so rustls cannot choose a process default on its own. Pin the ring
# provider for the Live WebSocket's TLS connector.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
