name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: fmt, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@v2

      # The in-app forecast video player uses wry's WebKitGTK child view on
      # Linux, so the GTK/WebKit development headers must be present at build
      # time. Vulkan and the Wayland/X11 client libraries are still loaded at
      # runtime and need no build packages.
      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace

  windows:
    name: windows (check, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # MSVC, CMake and NASM come with the windows-latest image; the TLS
      # crates (`ring`, `aws-lc-sys`) need all three.
      - name: Check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Prepare the self-contained voice asset before the release build. The
      # embedded-piper feature bakes this zip into Stormscope.exe; first launch
      # extracts it to %LOCALAPPDATA%\stormscope\piper.
      - name: Prepare the embedded Piper voice
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "staging"
          New-Item -ItemType Directory -Force $stage | Out-Null
          curl.exe -L --fail --retry 3 -o piper.zip `
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip
          if ($LASTEXITCODE -ne 0) { throw "Piper download failed" }
          Expand-Archive -Path piper.zip -DestinationPath $stage -Force
          $voiceDir = "$stage/piper/voices/en/en_US/lessac/high"
          New-Item -ItemType Directory -Force $voiceDir | Out-Null
          $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/high"
          foreach ($file in @("en_US-lessac-high.onnx", "en_US-lessac-high.onnx.json", "MODEL_CARD")) {
            curl.exe -L --fail --retry 3 -o "$voiceDir/$file" "$base/$file"
            if ($LASTEXITCODE -ne 0) { throw "Voice download failed: $file" }
          }
          @"
          Stormscope's Windows executable embeds the Piper runtime and the
          lessac high English voice.

          Piper: https://github.com/rhasspy/piper (MIT)
          Voice: https://huggingface.co/rhasspy/piper-voices
          Lessac dataset/license:
          https://www.cstr.ed.ac.uk/projects/blizzard/2013/lessac_blizzard2013/license.html
          "@ | Set-Content -Encoding UTF8 "$stage/piper/VOICE-LICENSE.txt"
          New-Item -ItemType Directory -Force crates/stormscope-app/assets | Out-Null
          Compress-Archive -Path "$stage/piper" `
            -DestinationPath crates/stormscope-app/assets/piper-windows.zip -Force
          Get-Item "$stage/piper/piper.exe", "$voiceDir/en_US-lessac-high.onnx", `
            crates/stormscope-app/assets/piper-windows.zip | Format-Table Name, Length

      - name: Build single-file release
        run: cargo build --release -p stormscope-app --features embedded-piper

      - name: Name the Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/stormscope.exe dist/Stormscope.exe

      - name: Upload the single-file Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: stormscope-windows-x86_64
          path: dist/Stormscope.exe
          if-no-files-found: error

  # Android builds are still maturing; keep the job informational so a
  # transient runner/NDK issue does not block unrelated pushes. It builds the
  # Rust cdylib (the part that can fail on code changes) and uploads it.
  android:
    name: android (rust cdylib)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install the Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build the Android cdylib
        run: cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build --release -p stormscope-android

      - name: Upload the Android library
        uses: actions/upload-artifact@v4
        with:
          name: stormscope-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/libstormscope_android.so
          if-no-files-found: error

  clippy:
    name: clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      # Informational on purpose: ~100 pre-existing style lints (the first
      # one clippy stops on is clippy::chunks_exact_to_as_chunks in
      # radar-decode). Without `-D warnings` the lints surface as annotated
      # warnings on the run while the job itself stays green; once the
      # backlog is cleaned up, add `-- -D warnings` here to make it gating.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
