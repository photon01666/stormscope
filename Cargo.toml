[workspace]
resolver = "2"
members = [
    "crates/radar-core",
    "crates/radar-decode",
    "crates/radar-data",
    "crates/radar-render",
    "crates/stormscope-app",
    "crates/stormscope-android",
    "crates/stormscope-setup",
]

[workspace.package]
version = "1.7.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/photon01666/stormscope"

[workspace.dependencies]
radar-core = { path = "crates/radar-core" }
radar-decode = { path = "crates/radar-decode" }
radar-data = { path = "crates/radar-data" }
radar-render = { path = "crates/radar-render" }

anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# egui companion: the archive day picker's calendar widget. Its datepicker
# speaks jiff's civil dates (not chrono), so that type crosses the boundary.
egui_extras = { version = "0.36", features = ["datepicker"] }
jiff = "0.2"
wgpu = "30"
# Zero-copy casting for the 3D mesh vertex buffers ([`MeshVertex`] → GPU).
bytemuck = { version = "1", features = ["derive"] }
# Mapbox/earcut polygon triangulation — needed to FILL the concave SPC
# outlook polygons (egui's convex_polygon can't).
earcutr = "0.5"

[profile.dev]
# Fast-ish builds while iterating on a big workspace
debug = 1

# …but dependencies carry *no* debug info. They are most of the size of every
# test/example binary (a single Stormscope test binary was ~300 MB, and a
# week of test builds left 44 GB of them behind), and nobody debugs through
# wgpu/egui here. The workspace crates keep `debug = 1` above, so backtraces
# through app code stay exact.
[profile.dev.package."*"]
debug = 0
