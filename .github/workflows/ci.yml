name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: fmt, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Build (release)
        run: cargo build --workspace --release

      # Build requirements note: eframe/wgpu load Vulkan and the Wayland/X11
      # client libraries at runtime (dlopen), so no extra apt packages are
      # needed to build or test here.
      - name: Test
        run: cargo test --workspace

  windows:
    name: windows (check, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # MSVC, CMake and NASM come with the windows-latest image; the TLS
      # crates (`ring`, `aws-lc-sys`) need all three.
      - name: Check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release -p stormscope-app

      - name: Upload the Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: stormscope-windows-x86_64
          path: target/release/stormscope.exe
          if-no-files-found: error

  clippy:
    name: clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      # Informational on purpose: ~100 pre-existing style lints (the first
      # one clippy stops on is clippy::chunks_exact_to_as_chunks in
      # radar-decode). Without `-D warnings` the lints surface as annotated
      # warnings on the run while the job itself stays green; once the
      # backlog is cleaned up, add `-- -D warnings` here to make it gating.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
