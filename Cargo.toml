[workspace]
resolver = "2"
members = [
    "crates/radar-core",
    "crates/radar-decode",
    "crates/radar-data",
    "crates/radar-render",
    "crates/stormscope-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
radar-core = { path = "crates/radar-core" }
radar-decode = { path = "crates/radar-decode" }
radar-data = { path = "crates/radar-data" }
radar-render = { path = "crates/radar-render" }

anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
wgpu = "30"

[profile.dev]
# Fast-ish builds while iterating on a big workspace
debug = 1
