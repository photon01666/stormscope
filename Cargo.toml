[workspace]
resolver = "2"
members = [
    "crates/radar-core",
    "crates/radar-decode",
    "crates/radar-data",
    "crates/radar-render",
    "crates/stormscope-app",
]

[workspace.package]
version = "1.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/photon01666/stormscope"

[workspace.dependencies]
radar-core = { path = "crates/radar-core" }
radar-decode = { path = "crates/radar-decode" }
radar-data = { path = "crates/radar-data" }
radar-render = { path = "crates/radar-render" }

anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
wgpu = "30"
# Zero-copy casting for the 3D mesh vertex buffers ([`MeshVertex`] → GPU).
bytemuck = { version = "1", features = ["derive"] }
# Mapbox/earcut polygon triangulation — needed to FILL the concave SPC
# outlook polygons (egui's convex_polygon can't).
earcutr = "0.5"

[profile.dev]
# Fast-ish builds while iterating on a big workspace
debug = 1
