[package]
name = "radar-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
radar-core = { workspace = true }
radar-decode = { workspace = true }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
chrono.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
flate2 = "1"
# GOES GLM Level 2 is NetCDF-4/HDF5. This reader is pure Rust (no libhdf5 /
# libnetcdf), so the binary stays self-contained.
netcdf-reader = { version = "0.9", default-features = false, features = ["netcdf4"] }
# HRRR simulated reflectivity ("Futurecast") is GRIB2 with complex packing
# and a Lambert-conformal grid; grib handles both, pure Rust.
grib = { version = "0.20.2", default-features = false }
# MRMS ships PNG-packed GRIB2 (template 5.41): the data section is a 16-bit
# grayscale PNG. Only the PNG decoder is needed.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# S3 listing/downloading for the NOAA OpenData buckets (anonymous).
nexrad-data = { version = "=1.0.0-rc.7", default-features = false, features = ["aws"] }
# nexrad-data's aws API is async (reqwest); driven from dedicated
# current-thread runtimes inside blocking wrappers (no tokio macros needed).
tokio = { version = "1", features = ["rt", "time", "net"] }

[dev-dependencies]
# examples/data_path_probe.rs uses a multi-thread tokio runtime + Central time.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
chrono-tz.workspace = true
