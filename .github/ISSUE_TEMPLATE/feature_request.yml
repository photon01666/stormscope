name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The workflow or radar-reading need behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should it look like? Screenshots/sketches from other radar apps are fine.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Radar data / decoding
        - Map & overlays
        - Animation / timeline
        - UI / controls
        - Performance
        - Packaging / platform
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This can be done with free/public data (no accounts or API keys).
          required: true
        - label: I searched existing issues and the README roadmap.
          required: true
